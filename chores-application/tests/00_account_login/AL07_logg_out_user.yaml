appId: com.anonymous.choresapplication
name: Log out from user


clearState: true
env:
  ID_OF_HOME_ICON: "homeIcon"
  ID_OF_HAMBURGER_MENU: "hamburgerIcon"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
#Log out from parentprofile
- tapOn:
    id: "${ID_OF_HOME_ICON}"
- tapOn:
    text: "Logg ut"
#Log out from user
- tapOn:
    id: "${ID_OF_HAMBURGER_MENU}"
- tapOn:
    text: "Logg ut"

#Checks
- assertVisible: "Logg inn"
- assertVisible: "Glemt passord"
- assertVisible: "Registrer deg"



