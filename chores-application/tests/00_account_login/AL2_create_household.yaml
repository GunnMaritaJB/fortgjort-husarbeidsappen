appId: com.anonymous.choresapplication
name: AL2 Create household

clearState: true

# Environment variables
env:
  PARENT_NAME: "[Enter_name_here]"

onFlowStart:
  - runFlow:
      file: "../stubs/login_test_testens.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
- assertVisible: "Legg til husstand"
- tapOn: "Husstandsnavn"
- inputText: "Test House"
- tapOn: "Husstands pin"
- inputText: "1234"
- tapOn: "Fullfør"
- assertVisible: "Test House"
- assertVisible:
    id: "dummyUser"
- tapOn:
    id: "dummyUser"
- inputText: "1234"
- tapOn: "OK"
- assertVisible: ${PARENT_NAME}
  