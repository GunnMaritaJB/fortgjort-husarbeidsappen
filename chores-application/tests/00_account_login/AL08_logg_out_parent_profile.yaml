appId: com.anonymous.choresapplication
name: Log out from parent profile


clearState: true
env:
  ID_OF_HOME_ICON: "homeIcon"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
