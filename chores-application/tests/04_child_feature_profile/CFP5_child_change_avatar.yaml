appId: com.anonymous.choresapplication
name: Child Change Avatar
# description: A simple flow to test the app's launch and welcome screen.
clearState: true
onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_child.yaml"
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
- tapOn:
    text: "Child"

- tapOn:
    id: "avatarBtn"

- tapOn:
    text: "🐭"

- assertVisible:
    text: "🐭"





