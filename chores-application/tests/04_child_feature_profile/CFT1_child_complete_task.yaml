appId: com.anonymous.choresapplication
name: CFT1 Child Complete Task

clearState: true

env:
  NAME_OF_TASK: "Test oppgave"

onFlowStart:
  - launchApp
  - tapOn:
      id: "emailInput"
  - inputText: "vionoreply@gmail.com"
  - tapOn:
      id: "password_input"
  - inputText: "Testing123."
  - tapOn: "Logg inn"
  - tapOn:
      id: "dummyChild_1"

onFlowComplete:
  - stopApp
---
# Press the child menu button
- tapOn:
    id: "menuButtonChild"
    label: "Click meny button"
- assertVisible: "Oppgaver"

# Child chooses to go to tasks
- tapOn:
    text: "Oppgaver"
    label: "Choose to go to tasks"
- assertVisible: "${NAME_OF_TASK}"

# Child chooses specific task
- tapOn:
    text: "${NAME_OF_TASK}"
    label: "Choose to go to the task"
- assertVisible: "FERDIG"

# Child completes the task
- tapOn:
    text: "FERDIG"
    label: "Choose to complete the task"
- waitForAnimationToEnd

# Check that the task is rendered as completed
- evalScript: ${counter = 0}
- evalScript: ${counterLimit = 7}

# Scroll down trying to find the completed task
- repeat:
    while:
      notVisible:
        id: "finishedTaskIcon"
    commands:
      - evalScript: "${counter < counterLimit}"
      - scroll
      - evalScript: ${counter = counter + 1}

- assertVisible:
    id: "finishedTaskIcon"
