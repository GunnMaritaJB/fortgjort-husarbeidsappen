appId: com.anonymous.choresapplication
name: CFP1 View Child Profile

clearState: true

env:
  CHILD_NAME: "Child"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_child.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
- tapOn:
    text: "Child"
- assertVisible: "Hei, ${CHILD_NAME}!"
