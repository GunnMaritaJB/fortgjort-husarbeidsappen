appId: com.anonymous.choresapplication
name: CFT1 Child Complete Task (chooses "ikke ferdig")

clearState: true

env:
  NAME_OF_TASK: "Test oppgave"

onFlowStart:
  - launchApp
  - tapOn:
      id: "emailInput"
  - inputText: "vionoreply@gmail.com"
  - tapOn:
      id: "password_input"
  - inputText: "Testing123."
  - tapOn: "Logg inn"
  - tapOn:
    id: "dummyChild_1"

onFlowComplete:
  - stopApp
---
# Press the child menu button
- tapOn:
    id: "menuButtonChild"
    label: "Click meny button"
- assertVisible: "Oppgaver"

# Child chooses to go to tasks
- tapOn:
    text: "Oppgaver"
    label: "Choose to go to tasks"
- assertVisible: "${NAME_OF_TASK}"

# Child chooses specific task
- tapOn:
    text: "${NAME_OF_TASK}"
    label: "Choose to go to the task"
- assertVisible: "IKKE FERDIG"

# Child chooses to not complete the task
- tapOn:
    text: "IKKE FERDIG"
    label: "Choose to complete the task"

# Check that the task is rendered as completed
- setVariable:
    name: "scrollCount"
    value: 0
- setVariable:
    name: "scrollLimit"
    value: 7

# Scroll down trying to find the completed task
- repeat:
    while:
      notVisible:
        text: "${NAME_OF_TASK}"
    commands:
      - scroll:
          direction: DOWN
          timeout: 100
      - setVariable:
          name: "scrollCount"
          value: "${scrollCount} + 1"
      - assertTrue: "${scrollCount} < ${scrollLimit}"

- assertVisible:
    text: "${NAME_OF_TASK}"
