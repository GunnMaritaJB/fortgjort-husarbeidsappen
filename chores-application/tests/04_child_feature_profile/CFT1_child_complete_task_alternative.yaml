appId: com.anonymous.choresapplication
name: CFT1 Child Complete Task (chooses "ikke ferdig")

clearState: true

env:
  NAME_OF_TASK: "Test oppgave"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_for_child.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
# Choose child profile
- tapOn:
    id: "dummyChild_1"

# Press the child menu button
- tapOn:
    id: "menuButtonChild"
    label: "Click meny button"
- assertVisible: "Oppgaver"

# Child chooses to go to tasks
- tapOn:
    text: "Oppgaver"
    label: "Choose to go to tasks"
- assertVisible: ${NAME_OF_TASK}

# Child chooses specific task
- tapOn:
    text: ${NAME_OF_TASK}
    label: "Choose to go to the task"
- assertVisible: "IKKE FERDIG"

# Child chooses to not complete the task
- tapOn:
    text: "IKKE FERDIG"
    label: "Choose to complete the task"

# Find the task
- runFlow:
    file: "../stubs/scroll_to_find_text.yaml"
    env:
      TEXT_TO_FIND: ${NAME_OF_TASK}

# Confirm task is visible
- assertVisible:
    text: ${NAME_OF_TASK}
