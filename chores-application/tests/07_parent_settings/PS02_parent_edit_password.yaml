appId: com.anonymous.choresapplication
name: Parent edit password


clearState: true
env:
  ID_OF_SETTINGS_ICON: "settingsIcon"
  ID_OF_HOME_ICON: "homeIcon"
  ID_OF_CURRENT_PASSWORD: "currentPassword"
  ID_OF_NEW_PASSWORD_1: "newPassword1"
  ID_OF_NEW_PASSWORD_2: "newPassword2"
  ID_OF_HAMBURGER_MENU: "hamburgerIcon"
  ID_OF_ENTER_PASSWORD: "enterPassword"
  ID_OF_ENTER_USERNAME: "enterUsername"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
- tapOn:
    id: "${ID_OF_SETTINGS_ICON}"
- tapOn:
    text: "Endre passord"


#Enter old password
- tapOn:
    id: "${ID_OF_CURRENT_PASSWORD}"
- eraseText
- inputText: "Password1."
#Enter new password
- tapOn:
    id: "${ID_OF_NEW_PASSWORD_1}"
- eraseText
- inputText: "Password123!"

#Repeating new password
- tapOn:
    id: "${ID_OF_NEW_PASSWORD_2}"
- eraseText
- inputText: "Password123!"
#Lagre
- tapOn:
    text: "Lagre"
#Logg ut
- tapOn:
    id: "${ID_OF_HOME_ICON}"
- tapOn:
    text: "Logg ut"
#Logg helt ut
- tapOn:
    id: "${ID_OF_HAMBURGER_MENU}"
- tapOn:
    text: "Logg ut"

#Enter Username
- tapOn:
    id: "${ID_OF_ENTER_USERNAME}"
- eraseText
- inputText: "vionoreply@gmail.com"

#Enter password
- tapOn:
    id: "${ID_OF_ENTER_PASSWORD}"
- eraseText
- inputText: "Password123!"

- tapOn:
    text: "Log In"
#Checks if hamburgermenu is visible, this is the only page this is visible on.
- assertVisible: "${ID_OF_HAMBURGER_MENU}"



