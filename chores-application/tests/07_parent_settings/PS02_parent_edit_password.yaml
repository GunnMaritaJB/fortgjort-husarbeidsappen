appId: com.anonymous.choresapplication
name: Parent edit password


clearState: true
env:
  ID_OF_SETTINGS_ICON: "settingsIcon"
  ID_OF_HOME_ICON: "homeIcon"
  ID_OF_CURRENT_PASSWORD: "currentPassword"
  ID_OF_NEW_PASSWORD_1: "newPassword1"
  ID_OF_NEW_PASSWORD_2: "newPassword2"
  ID_OF_HAMBURGER_MENU: "hamburgerIcon"
  ID_OF_ENTER_PASSWORD: "enterPassword"
  ID_OF_ENTER_USERNAME: "enterUsername"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_parent.yaml"
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
- tapOn:
    id: "parentUser"
- tapOn:
    text: "Innstillinger"
- tapOn:
    text: "Endre passord"


#Enter old password
- tapOn:
    text: "Nåværende passord"
- inputText: "Testing123."
#Enter new password
- tapOn:
    text: "Nytt passord"
- inputText: "Password1."

#Repeating new password
- tapOn:
    text: "Bekreft nytt passord"
- inputText: "Password1."
#Lagre
- tapOn:
    text: "Lagre nytt passord"
#Logg ut
- tapOn:
    id: "profileTab"
- tapOn:
    point: "6%,6%"
- tapOn:
    point: "31%,12%"

#Logg helt ut
- tapOn:
    id: "hamburgerButton"
- tapOn:
    id: "logOutUser"

#Enter Username
- tapOn:
    id: "emailInput"
- inputText: "vionoreply@gmail.com"

#Enter password
- tapOn:
    id: "password_input"
- inputText: "Password1."

- tapOn:
    text: "Logg inn"

- assertVisible: "Test House"



