appId: com.anonymous.choresapplication
name: Add New Reward Test
# description: A simple flow to test the app's launch and welcome screen.
clearState: true

env:
  PARENT_NAME: "Dummyuser1"
  REWARD_NAME: "Go to the park"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_parent.yaml"
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
- tapOn:
    id: "parentNameLabel"

# Press the reward option on the menu bar
- tapOn:
    text: "Belønninger"

# Check that we are on the right screen
- assertVisible: "BELØNNINGER"

# Press to add a new reward
- tapOn:
    id: "addRewardButton"

# Test that the add reward screen is visible
- assertVisible: "Legg til belønning"

# Input details
- tapOn:
    text: "Belønningsnavn"
- inputText: ${REWARD_NAME}
- tapOn:
    text: "Belønningspoeng"
- inputText: "50"
- tapOn:
    text: "Lagre"

# Check that the reward is added
- assertVisible: "BELØNNINGER"

- assertVisible: "Go to the park – 50 poeng"
