appId: com.anonymous.choresapplication
name: Edit point cost for reward

clearState: true
env:
  NAME_OF_REWARD: "Test Reward"
  ID_OF_CURRENT_POINTS: "Current_points"
onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_parent.yaml"
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
- tapOn:
    id: "parentUser"

# Press the reward option on the menu bar
- tapOn:
    text: "Belønninger"

- tapOn: "Test Reward – 50 poeng"
- tapOn:
    id: "Current_points"

#Delete existing points
- eraseText
- inputText: "33"
- tapOn:
    text: "Lagre"

- assertVisible: "Test Reward – 33 poeng"

- assertNotVisible: "Test Reward – 50 poeng"
