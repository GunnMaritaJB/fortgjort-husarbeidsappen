appId: com.anonymous.choresapplication
name: Edit point cost for reward

clearState: true
env:
  NAME_OF_REWARD: "Test belønning"
  ID_OF_CURRENT_POINTS: "Current_points"
onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
- tapOn:
    id: "parentNameLabel"

# Test if we are on the right screen
- assertVisible: ${PARENT_NAME}

# Press the reward option on the menu bar
- tapOn:
    id: "rewardMenuButton"

- tapOn:
    text: "${NAME_OF_REWARD}"
- tapOn:
    id: "${ID_OF_CURRENT_POINTS}"

#Delete existing points
- eraseText
- inputText: "33"
- tapOn:
    text: "Lagre"
- runFlow:
    file: "../stubs/scroll_to_find_text.yaml"
    env:
      TEXT_TO_FIND: ${REWARD_NAME}

- assertVisible:
    text: ${REWARD_NAME}

- assertVisible:
    leftOf:
      text: ${REWARD_NAME}
    text: "33"
