appId: com.anonymous.choresapplication
name: View purchased rewards

clearState: true
env:
  NAME_OF_CHILD: "Child 1"
  NAME_OF_REWARD: "Test Reward"
onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_parent.yaml"
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
- tapOn:
    id: "parentUser"
- tapOn:
    id: "childTest"
    index: 0
    
- tapOn:
    text: "Vis belønninger"
- assertVisible: "Belønninger kjøpt av barnet"
- assertVisible: "${NAME_OF_REWARD}"
