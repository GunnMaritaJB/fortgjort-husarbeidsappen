appId: com.anonymous.choresapplication
name: Delete reward
clearState: true
env:
  NAME_OF_REWARD: "Test Reward"
onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_parent.yaml"
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
- tapOn:
    id: "parentUser"
- tapOn:
    text: "Belønninger"

- assertVisible: "BELØNNINGER"
- assertVisible: "Søk etter belønning"

- assertVisible: "Test Reward – 50 poeng"

- tapOn:
    text: "Test Reward – 50 poeng"

- tapOn:
    text: "Slett"

- assertNotVisible:
    text: "Test Reward – 50 poeng"


