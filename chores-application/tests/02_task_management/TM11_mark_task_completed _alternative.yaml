appId: com.anonymous.choresapplication
name: TM11 Mark task as completed (alternative - no change to completion status)
# Description: A parent can mark a task as completed.

clearState: true

# Environment variables
env:
  TASK_NAME: "[Enter_name_here]"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
# Go to tasks.tsx screen
- tapOn:
    id: "taskMenuButton"
    label: "Go to task screen"

# Find the task to edit
- runFlow:
    file: "../stubs/scroll_to_find_text.yaml"
    env:
      TEXT_TO_FIND: ${TASK_NAME}
- assertVisible: ${TASK_NAME}

# Click on the task to edit
- tapOn:
    text: ${TASK_NAME}
    label: "Click on the task to edit"
- assertVisible: ${TASK_NAME}

# Click on oppgave oppsummering
- tapOn:
    text: "Oppgave oppsummering"
    label: "Click on oppgave oppsummering"

# Confirm that task is not completed
- assertVisible: "Ikke fullført"
- assertVisible: "Fullfør oppgaven"

# Check box twice to keep the task the same
- tapOn:
    id: "completeTaskCheckbox"
    rightOf:
      text: "Fullør oppgaven"
    repeat: 2

# Save task
- tapOn:
    text: "Lagre"
    label: "Save edited task"

# Find the task to edit
- runFlow:
    file: "../stubs/scroll_to_find_text.yaml"
    env:
      TEXT_TO_FIND: ${TASK_NAME}
- assertVisible: ${TASK_NAME}

# Click on the task to edit
- tapOn:
    text: ${TASK_NAME}
    label: "Click on the task to edit"
- assertVisible: ${TASK_NAME}

# Click on oppgave oppsummering
- tapOn:
    text: "Oppgave oppsummering"
    label: "Click on oppgave oppsummering"

# Confirm that task is still not completed
- assertVisible: "Ikke fullført"
- assertVisible: "Fullfør oppgaven"
