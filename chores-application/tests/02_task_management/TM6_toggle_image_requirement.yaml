appId: com.anonymous.choresapplication
name: TM6 Toggle image requirement on task

clearState: true

# Environment variables
env:
  TASK_NAME: "[Enter_name_here]"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
# Go to tasks screen
- tapOn:
    id: "taskMenuButton"
    label: "Go to task screen"

# Find the task to edit
- runFlow:
    file: "../stubs/scroll_to_find_text.yaml"
    env:
      TEXT_TO_FIND: ${TASK_NAME}
- assertVisible: ${TASK_NAME}

# Click on the task to edit
- tapOn:
    text: ${TASK_NAME}
    label: "Click on the task to edit"
- assertVisible: ${TASK_NAME}

# Click main section
- tapOn:
    text: "Hoveddetaljer"
    label: "Click on main section"
- assertVisible: "Fotobevis"

# Click on image requirement toggle
- tapOn:
    id: "imageRequirementCheckbox"
    label: "Click on image requirement toggle"

# Save editted task
- tapOn:
    text: "Lagre"
    label: "Save edited task"

# Check that the task is editted
- runFlow:
    file: "../stubs/scroll_to_find_text.yaml"
    env:
      TEXT_TO_FIND: ${TASK_NAME}
- assertVisible: ${TASK_NAME}
