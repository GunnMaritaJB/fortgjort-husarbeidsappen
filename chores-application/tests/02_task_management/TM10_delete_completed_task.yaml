appId: com.anonymous.choresapplication
name: TM10 Delete completed task
# Description: Verifies that it is not possible to delete a task that is completed.

clearState: true

# Environment variables
env:
  TASK_NAME: "[Enter_name_here]"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
# Go to tasks.tsx screen
- tapOn:
    id: "taskMenuButton"
    label: "Go to task screen"

# Find the task to edit
- runFlow:
    file: "../stubs/scroll_to_find_text.yaml"
    env:
      TEXT_TO_FIND: ${TASK_NAME}
- assertVisible: ${TASK_NAME}

# Click on the task to edit
- tapOn:
    text: ${TASK_NAME}
    label: "Click on the task to edit"
- assertVisible: ${TASK_NAME}

# Click on oppgave oppsummering
- tapOn:
    text: "Oppgave oppsummering"
    label: "Click on oppgave oppsummering"

# Confirm that task is completed
- assertVisible: "Avgjørelse"
- assertVisible: "Godkjenn"
- assertVisible: "Avvent"
- assertVisible: "Avslå"

# Click on delete task button
- tapOn:
    text: "Slett"
    label: "Click on delete task button"

# Confirm that message of not being able to delete a completed task is shown
- assertVisible: "Oppgaven er fullført."
- assertVisible:
    id: "closeModalButton"
