- tapOn:
    text: "Oppgaver"
    #id: "taskMenuButton"
    label: "Go to task screen"

# Press the task option on the menu bar
- assertVisible: "OPPGAVER"
- assertVisible: "Søk i oppgaver"
- assertVisible:
    id: "addTaskButton"
