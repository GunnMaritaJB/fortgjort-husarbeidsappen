appId: com.anonymous.choresapplication
name: TM1 View tasks

clearState: true
onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_parent.yaml"
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
# Press the task option on the menu bar
- tapOn:
    id: "parentUser"

- tapOn:
    text: "Oppgaver"


# Press the task option on the menu bar
- assertVisible: "OPPGAVER"

- assertVisible:
    id: "addTaskButton"
- assertVisible:
    id: "taskItem-recurring"

- assertVisible:
    id: "taskItem-once"

