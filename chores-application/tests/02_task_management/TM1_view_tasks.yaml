appId: com.anonymous.choresapplication
name: TM1 View all tasks

clearState: true
onFlowStart:
  - launchApp
  - tapOn:
      id: "emailInput"
  - inputText: "vionoreply@gmail.com"
  - tapOn:
      id: "password_input"
  - inputText: "Testing123."
  - tapOn: "Logg inn"
  - tapOn:
      id: "dummyUser"
  - inputText: "1234"
  - tapOn: "OK"

onFlowComplete:
  - stopApp
---
# Press the task option on the menu bar
- tapOn:
    id: "taskMenuButton"
    label: "Go to task screen"

# Press the task option on the menu bar
- assertVisible: "OPPGAVER"
- assertVisible: "Søk task"
- assertVisible:
    id: "addTaskButton"
