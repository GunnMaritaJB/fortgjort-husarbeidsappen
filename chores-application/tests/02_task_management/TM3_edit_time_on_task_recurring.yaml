appId: com.anonymous.choresapplication
name: TM3 Edit time on task (recurring)

clearState: true

env:
  TASK_NAME: "[Task_name]"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_parent.yaml"
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
# Go to index.tsx screen
- tapOn:
    id: "parentUser"

- tapOn:
    text: "Oppgaver"

# Click on the task to edit
- tapOn:
    id: "taskItem-recurring"

- tapOn:
    id: "assign_child"
- assertVisible:
    id: "assign_child"

# Click time section
- assertVisible: "Gjentagende"

# Choose new date
- tapOn:
    text: "TI"

- tapOn:
    text: "FR"
- assertVisible:
    text: "FR"


# Save editted task
- tapOn:
    text: "Lagre"




