appId: com.anonymous.choresapplication
name: TM3 Edit time on task (recurring)

clearState: true

env:
  TASK_NAME: "[Task_name]"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
# Go to tasks screen
- tapOn:
    id: "taskMenuButton"
    label: "Go to task screen"

# Find the task to edit
- runFlow:
    file: "../stubs/scroll_to_find_text.yaml"
    env:
      TEXT_TO_FIND: ${TASK_NAME}
- assertVisible: ${TASK_NAME}

# Click on the task to edit
- tapOn:
    text: ${TASK_NAME}
    label: "Click on the task to edit"
- assertVisible: ${TASK_NAME}

# Click time section
- tapOn:
    text: "Tidspunkt"
    label: "Click time section"
- assertVisible: "Gjentagende"
- tapOn:
    text: "Gjentagende"
    label: "Click on recurring"

# Choose new date
- tapOn:
    id: "tirsdagButton"
    label: "Choose new day to repeat on"

# Save editted task
- tapOn:
    text: "Lagre"
    label: "Save edited task"

# Check that the task is added
- runFlow:
    file: "../stubs/scroll_to_find_text.yaml"
    env:
      TEXT_TO_FIND: ${TASK_NAME}

- assertVisible: ${TASK_NAME}
- assertVisible:
    id: "recurringIcon"
    rightOf:
      text: ${TASK_NAME}
