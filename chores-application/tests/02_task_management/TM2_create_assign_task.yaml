appId: com.anonymous.choresapplication
name: TM2 Add New Reward Alternative

clearState: true

env:
  TASK_NAME: "Test Task"
  TASK_POINTS: "50"
  CHILD_1_NAME: "[dummyChild_1_name]"
  CHILD_2_NAME: "[dummyChild_2_name]"

onFlowStart:
  - launchApp
  - tapOn:
      id: "emailInput"
  - inputText: "vionoreply@gmail.com"
  - tapOn:
      id: "password_input"
  - inputText: "Testing123."
  - tapOn: "Logg inn"
  - tapOn:
      id: "dummyUser"
  - inputText: "1234"
  - tapOn: "OK"

onFlowComplete:
  - stopApp
---
# Press the task option on the menu bar
- tapOn:
    id: "taskMenuButton"
    label: "Go to task screen"

# Press the add task button
- tapOn:
    id: "addTaskButton"
    label: "Press add task button"

# Check that we are on the add task screen
- assertVisible: "NY OPPGAVE"
- assertVisible: "Navn på oppgave"

# Input the main fields for the task
- tapOn:
    text: "Navn på oppgave"
    label: "Choose to write the name of the task"
- inputText: "${TASK_NAME}"
- tapOn:
    text: "Poengsum"
    label: "Choose to write the points of the task"
- inputText: "${TASK_POINTS}"
- tapOn:
    id: "fotoBevisCheck"
    rightOf:
      text: "Fotobevis"
    label: "Choose to take a photo as proof"

# Go to assigning to child
- tapOn:
    text: "Tildel til barn"
    label: "Go to assign to child"
- assertVisible: "${CHILD_1_NAME}"
- assertVisible: "${CHILD_2_NAME}"

# Assign task to child 1 (click child 2 twice so that the task should not be assigned to child 2)
- tapOn:
    text: "${CHILD_1_NAME}"
    label: "Assign task to child 1"
- tapOn:
    text: "${CHILD_2_NAME}"
    repeat: 2
    label: "Double click child 2 to not assign task to child 2"

# Go to "Tidspunkt"  (as "En gang" is default)
- tapOn:
    text: "Tidspunkt"
    label: "Go to Tidspunkt"
- assertVisible: "En gang"
- assertVisible: "Gjentagende"

# Choose one time date
- tapOn:
    id: "datePicker"
    label: "Choose date picker"
- tapOn:
    text: "6"
    label: "Choose a random date that begins with 6"

# Go to skjul/vis
- tapOn:
    text: "Skjul/Vis"
    label: "Go to Skjul/Vis"
- assertVisible: "Vis"
- assertVisible: "Skjul"
- tapOn:
    text: "Vis"
    label: "Choose to show the task"

# Save the task
- tapOn:
    text: "Lagre"
    label: "Save the task"

# Check that the task is added
- evalScript: ${counter = 0}
- evalScript: ${counterLimit = 7}

# Scroll down trying to find the added task
- repeat:
    while:
      notVisible:
        text: "${TASK_NAME}"
    commands:
      - evalScript: "${counter < counterLimit}"
      - scroll
      - evalScript: ${counter = counter + 1}

# Check that the task is created and assigned to child 1
- assertVisible: "${TASK_NAME}"
- assertVisible:
    text: "[dummyChild_1_name]"
    below:
      text: "${TASK_NAME}"
- assertVisible:
    text: "6/"
    below:
      text: "${TASK_NAME}"
