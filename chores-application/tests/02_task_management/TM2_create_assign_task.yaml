appId: com.anonymous.choresapplication
name: TM2 Add New Reward Alternative

clearState: true

env:
  TASK_NAME: "Test Task"
  TASK_POINTS: "50"
  CHILD_1_NAME: "[dummyChild_1_name]"
  CHILD_2_NAME: "[dummyChild_2_name]"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_parent.yaml"
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
- tapOn:
   id: "parentUser"

# Press the task option on the menu bar
#- retry:
#    maxRetries: 3
#    commands:
#      - tapOn:
#          id: "parentNameLabel"

- tapOn:
    text: "Oppgaver"
    label: "Go to task screen"

# Press the add task button
- tapOn:
    id: "addTaskButton"

# Check that we are on the add task screen
- assertVisible: "NY OPPGAVE"
- assertVisible: "Navn på oppgave"

# Input the main fields for the task
- tapOn:
    id: "taskNameID"
    label: "Choose to write the name of the task"
- inputText: ${TASK_NAME}

#- tapOn:
#    id: "fotoBevisCheck"
#    rightOf:
#      text: "Fotobevis"
#    label: "Choose to take a photo as proof"

# Go to assigning to child
- assertVisible:
    id: "assign_child"
- tapOn:
    id: "assign_child"
- assertVisible:
    id: "assign_child"
    label: "Go to assign to child"
#- assertVisible: ${CHILD_1_NAME}
#- assertVisible: ${CHILD_2_NAME}

# Assign task to child 1 (click child 2 twice so that the task should not be assigned to child 2)
#- tapOn:
#    text: ${CHILD_1_NAME}
#    label: "Assign task to child 1"
#- tapOn:
#    text: ${CHILD_2_NAME}
#    repeat: 2
#    label: "Double click child 2 to not assign task to child 2"

- tapOn:
    id: "pointsID"
    label: "Choose to write the points of the task"
- inputText: ${TASK_POINTS}

# Go to "Tidspunkt"  (as "En gang" is default)

- assertVisible: "En gang"
- assertVisible: "Gjentagende"

# Choose one time date
- tapOn:
    id: "datePicker"
- tapOn:
    text: "28"
- tapOn:
    text: "OK"

# Go to skjul/vis
#- tapOn:
#    text: "OK"

- assertVisible: "Vis"
- assertVisible: "Skjul"
- tapOn:
    text: "Vis"
    label: "Choose to show the task"

# Save the task
- tapOn:
    text: "Lagre"

# Check that the task is added
- runFlow:
    file: "../stubs/scroll_to_find_text.yaml"
    env:
      TEXT_TO_FIND: ${TASK_NAME}
- assertVisible: ${TASK_NAME}

# Check that the task is created and assigned to child 1
