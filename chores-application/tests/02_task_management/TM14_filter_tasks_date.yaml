appId: com.anonymous.choresapplication
name: TM14 Filter index.tsx by child

clearState: true

# Environment variables
env:
  TASK_NAME: "[Enter_name_here]"
  DAY_CHOICE: "16"
  WRONG_DAY_CHOICE: "17"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_parent.yaml"
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
# Go to index.tsx screen
- tapOn:
    id: "parentUser"

- tapOn:
    text: "Oppgaver"

# Choose to filter by date
- tapOn:
    id: "filterDateButton"

- tapOn:
    id: "filterDateButton"

- tapOn:
    id: "filterDateButton"


