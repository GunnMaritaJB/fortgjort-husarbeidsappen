appId: com.anonymous.choresapplication
name: TM4 Edit points on task (cancel operation)

clearState: true

# Environment variables
env:
  NEWPOINTS: "0"
  TASK_NAME: "[Enter_name_here]"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_parent.yaml"
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
- tapOn:
    id: "parentUser"

- tapOn:
    text: "Oppgaver"

- tapOn:
    id: "taskItem-recurring"


- assertVisible: "Poengsum"
- tapOn:
    id: "pointsID"
- inputText: ${NEWPOINTS}



# Save editted task
- tapOn:
    text: "Avbryt"


