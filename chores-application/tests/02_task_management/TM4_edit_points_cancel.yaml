appId: com.anonymous.choresapplication
name: TM4 Edit points on task (cancel operation)

clearState: true

# Environment variables
env:
  NEWPOINTS: "1000"
  TASK_NAME: "[Enter_name_here]"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
# Go to tasks.tsx screen
- tapOn:
    id: "taskMenuButton"
    label: "Go to task screen"

# Find the task to edit
- runFlow:
    file: "../stubs/scroll_to_find_text.yaml"
    env:
      TEXT_TO_FIND: ${TASK_NAME}
- assertVisible: ${TASK_NAME}

# Click on the task to edit
- tapOn:
    text: ${TASK_NAME}
    label: "Click on the task to edit"
- assertVisible: ${TASK_NAME}

# Click main section
- tapOn:
    text: "Hoveddetaljer"
    label: "Click on main section"
- assertVisible: "Poengsum"

# Choose point input field
- tapOn:
    id: "poengSumInput"
    label: "Choose point input field"

# Write new points
- copyTextFrom:
    id: "poengSumInput"
- eraseText
- inputText: ${NEWPOINTS}

# Save editted task
- tapOn:
    text: "Avbryt"
    label: "Cancel edit task"

# Check that the task is added
- runFlow:
    file: "../stubs/scroll_to_find_text.yaml"
    env:
      TEXT_TO_FIND: ${TASK_NAME}

- assertVisible: ${TASK_NAME}
- assertVisible:
    text: ${maestro.copiedText}
    rightOf:
      text: ${TASK_NAME}
