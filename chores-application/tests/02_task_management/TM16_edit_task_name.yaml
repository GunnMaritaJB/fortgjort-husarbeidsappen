appId: com.anonymous.choresapplication
name: TM16 Edit name of task

clearState: true

# Environment variables
env:
  NEW_NAME: " 2"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_parent.yaml"
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
- tapOn:
    id: "parentUser"

# Go to index.tsx screen
- tapOn:
    text: "Oppgaver"

# Find the task to edit
- tapOn:
    id: "taskItem-recurring"


# Choose point input field
- tapOn:
    id: "taskNameID"

# Write new task name
- inputText: ${NEW_NAME}

# Save editted task
- tapOn:
    text: "Lagre"

