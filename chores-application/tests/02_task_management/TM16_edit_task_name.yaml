appId: com.anonymous.choresapplication
name: TM16 Edit name of task

clearState: true

# Environment variables
env:
  TASK_NAME: "[Enter_name_here]"
  NEW_NAME: "[Enter_new_name_here]"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
# Go to tasks screen
- tapOn:
    id: "taskMenuButton"
    label: "Go to task screen"

# Find the task to edit
- runFlow:
    file: "../stubs/scroll_to_find_text.yaml"
    env:
      TEXT_TO_FIND: ${TASK_NAME}
- assertVisible: ${TASK_NAME}

# Click on the task to edit
- tapOn:
    text: ${TASK_NAME}
    label: "Click on the task to edit"
- assertVisible: ${TASK_NAME}

# Click main section
- tapOn:
    text: "Hoveddetaljer"
    label: "Click on main section"

# Choose point input field
- tapOn:
    id: "taskNameInput"
    label: "Choose task name input field"

# Write new task name
- eraseText
- inputText: ${NEW_NAME}

# Save editted task
- tapOn:
    text: "Lagre"
    label: "Save edited task"

# Check that the task is added
- runFlow:
    file: "../stubs/scroll_to_find_text.yaml"
    env:
      TEXT_TO_FIND: ${NEW_NAME}

- assertNotVisible: ${TASK_NAME}
- assertVisible: ${NEW_NAME}
