appId: com.anonymous.choresapplication
name: TM14 Filter index.tsx by child

clearState: true

# Environment variables
env:
  TASK_NAME: "[Enter_name_here]"
  CHILD_NAME_1: "[Enter_child_name_here]"
  CHILD_NAME_2: "[Enter_child_name_here]"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_parent.yaml"
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
- tapOn:
    id: "parentUser"
# Go to index.tsx screen
- tapOn:
    text: "Oppgaver"

# Choose to filter by child
- tapOn:
    id: "filterChildButton"

- tapOn:
    id: "filterChildButton"
- tapOn:
    id: "filterChildButton"


