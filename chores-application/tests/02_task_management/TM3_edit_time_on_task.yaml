appId: com.anonymous.choresapplication
name: TM3 Edit time on task

clearState: true

env:
  TASK_NAME: "Test Task"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_parent.yaml"
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---

- tapOn:
    id: "parentUser"

# Go to index.tsx screen
- tapOn:
    text: "Oppgaver"


# Click on the task to edit
- tapOn:
    id: "taskItem-once"

- tapOn:
    id: "assign_child"
- assertVisible:
    id: "assign_child"

# Click time section
- tapOn:
    id: "datePicker"


# Choose new date
- tapOn:
    text: "13"
- tapOn:
   text: "OK"

# Save editted task
- tapOn:
    text: "Lagre"



