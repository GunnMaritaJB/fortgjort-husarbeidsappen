appId: com.anonymous.choresapplication
name: TM15 Search for a specific task

clearState: true

# Environment variables
env:
  TASK_NAME: "Rydd"
  TASK_NAME_2: "[Enter_another_name_here]"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_parent.yaml"
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
- tapOn:
    id: "parentUser"
# Go to index.tsx screen
- tapOn:
    text: "Oppgaver"

# Interact with the search bar
- tapOn:
    text: "Søk i oppgaver"

- inputText: ${TASK_NAME}

