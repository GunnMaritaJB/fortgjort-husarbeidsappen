appId: com.anonymous.choresapplication
name: TM4 Edit points on task

clearState: true

# Environment variables
env:
  NEWPOINTS: "0"
  TASK_NAME: "[Enter_name_here]"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_parent.yaml"
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
- tapOn:
    id: "parentUser"

- tapOn:
    text: "Oppgaver"

# Find the task to edit


# Click on the task to edit
- tapOn:
    id: "taskItem-once"

- tapOn:
    id: "pointsID"
- inputText: ${NEWPOINTS}

# Save editted task
- tapOn:
    text: "Lagre"



