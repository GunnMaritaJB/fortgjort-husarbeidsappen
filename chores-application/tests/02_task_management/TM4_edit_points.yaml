appId: com.anonymous.choresapplication
name: TM4 Edit points on task

clearState: true

# Environment variables
env:
  NEWPOINTS: "1000"
  TASK_NAME: "[Enter_name_here]"

onFlowStart:
  - launchApp
  - tapOn:
      id: "emailInput"
  - inputText: "vionoreply@gmail.com"
  - tapOn:
      id: "password_input"
  - inputText: "Testing123."
  - tapOn: "Logg inn"
  - tapOn:
      id: "dummyUser"
  - inputText: "1234"
  - tapOn: "OK"

onFlowComplete:
  - stopApp
---
# Go to tasks screen
- tapOn:
    id: "taskMenuButton"
    label: "Go to task screen"

# Click on the task to edit
- assertVisible: "${TASK_NAME}"
- tapOn:
    text: "${TASK_NAME}"
    label: "Click on the task to edit"
- assertVisible: "${TASK_NAME}"

# Click main section
- tapOn:
    text: "Hoveddetaljer"
    label: "Click on main section"
- assertVisible: "Poengsum"

# Choose point input field
- tapOn:
    id: "poengSumInput"
    label: "Choose point input field"

# Write new points
- eraseText
- inputText: "${NEWPOINTS}"

# Save editted task
- tapOn:
    text: "Lagre"
    label: "Save edited task"

# Check that the task is added
- setVariable:
    name: "scrollCount"
    value: 0
- setVariable:
    name: "scrollLimit"
    value: 7

# Scroll down trying to find the added task
- repeat:
    while:
      notVisible:
        text: "${TASK_NAME}"
    commands:
      - scroll:
          direction: DOWN
          timeout: 100
      - setVariable:
          name: "scrollCount"
          value: "${scrollCount} + 1"
      - assertTrue: "${scrollCount} < ${scrollLimit}"

- assertVisible: "${TASK_NAME}"
- assertVisible:
    text: "${NEWPOINTS}"
    rightOf:
      text: "${TASK_NAME}"
