appId: com.anonymous.choresapplication
name: TM4 Edit points on task

clearState: true

# Environment variables
env:
  NEWPOINTS: "125"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_parent.yaml"
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
- tapOn:
    id: "parentUser"

- tapOn:
    text: "Oppgaver"


# Click on the task to edit
- tapOn:
    id: "taskItem-once"

- tapOn:
    id: "pointsID"
- eraseText
- inputText: ${NEWPOINTS}

- tapOn:
    text: "Vis"
# Save editted task
- tapOn:
    text: "Lagre"




