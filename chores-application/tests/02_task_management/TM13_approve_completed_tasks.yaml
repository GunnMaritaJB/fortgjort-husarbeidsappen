appId: com.anonymous.choresapplication
name: TM13 Approve completed task
# Description: A parent can mark a task as completed.

clearState: true

# Environment variables
env:
  TASK_NAME: "[Enter_name_here]"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_parent.yaml"
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
# Go to index.tsx screen
- tapOn:
    id: "parentNameLabel"

- tapOn:
    text: "Oppgaver"


# Ensure task is completed
- assertVisible: "✅ Fullført"
- assertVisible: "🕒 Venter på godkjenning"

# Approve the task
- tapOn:
    text: "Bekreft"

- assertVisible: "Bekreft oppgave"

- tapOn:
    text: "Ja, bekreft"

# Check that the task is approved
- assertVisible: "🟢 Godkjent"
