appId: com.anonymous.choresapplication
name: TM13 Approve completed task
# Description: A parent can mark a task as completed.

clearState: true

# Environment variables
env:
  TASK_NAME: "[Enter_name_here]"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
# Go to index.tsx screen
- tapOn:
    id: "taskMenuButton"
    label: "Go to task screen"

# Find the task to complete
- runFlow:
    file: "../stubs/scroll_to_find_text.yaml"
    env:
      TEXT_TO_FIND: ${TASK_NAME}
- assertVisible: ${TASK_NAME}

# Click on the task
- tapOn:
    text: ${TASK_NAME}
    label: "Click on the task"
- assertVisible: ${TASK_NAME}

# Go to oppgave oppsummering
- tapOn:
    text: "Oppgave oppsummering"
    label: "Go to oppgave oppsummering"

# Ensure task is completed
- assertVisible: "Avgjørelse"
- assertVisible: "Godkjenn"
- assertVisible: "Avvent"
- assertVisible: "Avslå"

# Approve the task
- tapOn:
    text: "Godkjenn"
    label: "Approve the task"

# Save the task
- tapOn:
    text: "Lagre"
    label: "Save the task"

# Search for the task
- runFlow:
    file: "../stubs/scroll_to_find_text.yaml"
    env:
      TEXT_TO_FIND: ${TASK_NAME}
- assertVisible: ${TASK_NAME}

# Click on the task
- tapOn:
    text: ${TASK_NAME}
    label: "Click on the task"
- assertVisible: ${TASK_NAME}

# Go to oppgave oppsummering
- tapOn:
    text: "Oppgave oppsummering"
    label: "Go to oppgave oppsummering"

# Check that the task is approved
- assertVisible: "Bekreftet"
