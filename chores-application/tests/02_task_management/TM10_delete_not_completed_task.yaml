appId: com.anonymous.choresapplication
name: TM10 Delete not completed task

clearState: true

# Environment variables
env:
  TASK_NAME: "[Enter_name_here]"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"


onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_parent.yaml"
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
- tapOn:
    id: "parentNameLabel"

- tapOn:
    text: "Oppgaver"


- assertVisible: "❌ Ikke fullført"

# Click on delete task button
- tapOn:
    text: "Slett"

- assertVisible: "Er du sikker på at du vil slette denne oppgaven?"

- tapOn:
    text: "SLETT"

- assertNotVisible:
    id: "taskItem-once"
