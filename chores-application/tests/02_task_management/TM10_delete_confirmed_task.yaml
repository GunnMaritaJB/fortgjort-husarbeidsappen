appId: com.anonymous.choresapplication
name: TM10 Delete confirmed task
# Description: Verifies that it is not possible to delete a task that is completed.

clearState: true

# Environment variables
env:
  TASK_NAME: "Test Task"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_parent.yaml"
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
# Go to index.tsx screen
- tapOn:
    id: "parentNameLabel"

- tapOn:
    text: "Oppgaver"
- assertVisible: "✅ Fullført"
- assertVisible: "🟢 Godkjent"


# Click on delete task button
- tapOn:
    text: "Slett"

- assertVisible: "Er du sikker på at du vil slette denne oppgaven?"

- tapOn:
    text: "SLETT"

- assertNotVisible: "✅ Fullført"
- assertNotVisible: "🟢 Godkjent"

