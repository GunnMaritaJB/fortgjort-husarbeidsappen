appId: com.anonymous.choresapplication
name: Child View Already Earned Rewards
# description: A simple flow to test the app's launch and welcome screen.
clearState: true
onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_for_child.yaml"

onFlowComplete:
  -runFlow:
    file: "../stubs/stop_app.yaml"
---
- tapOn:
    id: "dummyChild_1"

- tapOn:
    id: "childMenuBtn"

- tapOn:
    text: "Belønninger"

- tapOn:
    id: "backPack"

- assertVisible:
    image: "Mine belønninger"

- tapOn:
    id: "reward1"

- assertVisible:
    text: "Vil du kjøpe denne belønningen?"

- tapOn:
    text: "Ja kjøp"






