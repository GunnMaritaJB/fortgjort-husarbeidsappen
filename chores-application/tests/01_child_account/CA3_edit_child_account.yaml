appId: com.anonymous.choresapplication
name: Edit Child Account
# description: A simple flow to test the app's launch and welcome screen.
clearState: true
onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_parent.yaml"
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
- tapOn:
    id: "parentNameLabel"

- tapOn:
    id: "childTest"

- tapOn:
    text: "Rediger profil"

- tapOn:
    id: "childNameInput"
- eraseText
- inputText:
    text: "EditedChildName"

- tapOn:
    text: "🐵"

- tapOn:
    text: "Fullfør"

- assertVisible: "🐵 EditedChildName"





