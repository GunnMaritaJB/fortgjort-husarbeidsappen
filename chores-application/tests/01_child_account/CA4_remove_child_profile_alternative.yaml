appId: com.anonymous.choresapplication
name: CA4 Remove Child Profile Alternative (cancel)

clearState: true

env:
  CHILD_NAME: "🐵 EditedChildName"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_parent.yaml"
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "parentNameLabel"
# Choose child to delete
- tapOn: ${CHILD_NAME}

# Check if we are on the child screen
- assertVisible: "Slett profil"

# Click on the delete profile button
- tapOn: "Slett profil"
- assertVisible: "Avbryt"

# Delete child profile
- tapOn: "Avbryt"
- assertVisible:
    id: "ChildName"
- assertVisible:
    id: "opptjentePoeng"
- assertVisible: "Slett profil"
