appId: com.anonymous.choresapplication
name: CA4 Remove Child Profile

clearState: true

env:
  CHILD_NAME: "🐵 EditedChildName"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_parent.yaml"
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
- tapOn:
    id: "parentNameLabel"
# Choose child to delete
- tapOn: ${CHILD_NAME}


# Click on the delete profile button
- tapOn: "Slett profil"

# Delete child profile
- tapOn: "Slett"
- assertNotVisible: ${CHILD_NAME}
