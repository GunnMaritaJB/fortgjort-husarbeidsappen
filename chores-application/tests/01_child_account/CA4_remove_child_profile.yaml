appId: com.anonymous.choresapplication
name: CA4 Remove Child Profile

clearState: true

env:
  CHILD_NAME: "[Child_name]"
  PARENT_NAME: "[Parent_name]"

onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
# Choose child to delete
- tapOn: ${CHILD_NAME}

# Check if we are on the child screen
- assertVisible: ${CHILD_NAME}
- assertVisible: "Opptjente poeng"
- assertVisible: "Slett profil"

# Click on the delete profile button
- tapOn: "Slett profil"
- assertVisible: "Er du sikker på at du vil fjerne barnet fra husstanden"
- assertVisible: "Slett"

# Delete child profile
- tapOn: "Slett"
- assertVisible: ${PARENT_NAME}
- assertNotVisible: ${CHILD_NAME}
