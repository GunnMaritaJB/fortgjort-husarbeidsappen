appId: com.anonymous.choresapplication
name: Create Child Account
# description: A simple flow to test the app's launch and welcome screen.
clearState: true
onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_parent.yaml"
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
# add_child_btn er inne på parent profile
- tapOn:
    id: "parentNameLabel"

- tapOn:
    id: "addChildLabel"

- tapOn:
    text: "Fornavn"

- inputText:
    text: "Child 2"

- tapOn:
    point: "50%,43%"

- tapOn:
    point: "30%,40%"

- tapOn:
    point: "49%,40%"

- tapOn:
    point: "68%,40%"

- tapOn:
    text: "OK"

- tapOn:
    text: "🦁"

- tapOn:
    text: "Fullfør"

- assertVisible: "🦁 Child 2"





