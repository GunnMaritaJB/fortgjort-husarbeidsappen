appId: com.anonymous.choresapplication
name: Adjust points
# description: A simple flow to test the app's launch and welcome screen.
clearState: true
onFlowStart:
  - runFlow:
      file: "../stubs/login_vio_user.yaml"

onFlowComplete:
  - runFlow:
      file: "../stubs/logout_from_parent.yaml"
  - runFlow:
      file: "../stubs/logout_from_user.yaml"
  - runFlow:
      file: "../stubs/stop_app.yaml"
---
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "parentNameLabel"

# add_child_btn er inne på parent profile
- tapOn:
    id: "childTest"

- tapOn:
    text: "Rediger profil"

- tapOn:
    id: "inputPoints"
- eraseText
- inputText:
    text: "123"

- hideKeyboard

- tapOn:
    text: "Fullfør"

- tapOn:
    id: "childTest"

- assertVisible: "Opptjente poeng: 123"





